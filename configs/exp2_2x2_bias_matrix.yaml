# 2x2 Harness Swap Matrix
# Compares the Customer Harness against Harbor's Reference Harness (antigravity-sdk)
# Run with: harbor run -c configs/exp2_2x2_bias_matrix.yaml
job_name: "exp2_2x2_bias_matrix"
jobs_dir: "jobs"
n_concurrent_trials: 3
n_attempts: 3

environment:
  type: "docker"

agents:
  - import_path: "harnesses.acme_agent:AcmeAgent"
    model_name: "gemini-3.1-pro-preview"
  - name: "antigravity-sdk"
    model_name: "vertex_ai/gemini-3.1-pro-preview"
    kwargs:
      reasoning_effort: "high"

tasks:
  - path: "datasets/acme_kw_bench/q3-revenue-reconciliation"
  - path: "datasets/acme_kw_bench/vendor-msa-compliance-audit"
  - path: "datasets/acme_kw_bench/customer-escalation-rca"

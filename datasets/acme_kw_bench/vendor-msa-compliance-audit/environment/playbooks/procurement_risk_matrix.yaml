rules:
  - clause_id: "SEC-4.2"
    topic: "Payment Terms"
    acceptable_threshold: "Net 30 or Net 45"
    fallback_position: "Require Net 30 days."
  - clause_id: "SEC-8.1"
    topic: "Limitation of Liability"
    acceptable_threshold: "Minimum 2.0x (200%) of annual fees paid"
    fallback_position: "Restore cap to 2.0x annual fees."
  - clause_id: "SEC-11.3"
    topic: "Data Residency"
    acceptable_threshold: "Strictly US and EU regions only"
    fallback_position: "Remove non-US/EU regions (ap-southeast-1 prohibited)."
  - clause_id: "SEC-14.1"
    topic: "Termination for Convenience"
    acceptable_threshold: "Maximum 30 days prior written notice"
    fallback_position: "Reduce notice period to 30 days."
